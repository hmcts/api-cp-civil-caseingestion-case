name: Infrastructure

# Registers the Case Ingestion Case API in APIM: sandbox (infrastructure/sbox.tfvars, backend dev)
# demo (infrastructure/demo.tfvars) and preview (infrastructure/preview.tfvars, backend SIT; demo does not connect to CP). Pull requests get a plan posted as a comment;
# pushes to main apply.

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "src/main/resources/openapi/**"
      - ".github/workflows/terraform-infra.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "src/main/resources/openapi/**"
      - ".github/workflows/terraform-infra.yaml"
  workflow_dispatch:
    inputs:
      overrideAction:
        description: "Run plan or apply"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  FILE_PATH_OPENAPI: src/main/resources/openapi

jobs:
  precheck:
    name: Terraform Precheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform format check
        uses: hmcts/cnp-githubactions-library/terraform-fmt@main
        with:
          working-directory: infrastructure
          recursive: true

  # Not the shared terraform-deploy-openId.yaml workflow: it runs Terraform straight after
  # checkout, and the spec has to be bundled first. This job runs the same action itself.
  terraform-sbox:
    name: Terraform sbox
    needs: [ precheck ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.overrideAction == 'plan' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # apis.tf reads each spec with yamldecode(file(...)), which cannot follow the $refs into
      # paths/ and schemas/. Bundle every version folder's spec in place (v1/openapi.yml, ...),
      # at the paths sbox.tfvars points to.
      - name: Bundle the modular spec of every API version
        run: |
          npm install -g @redocly/cli@latest
          bash .github/scripts/bundle-openapi-versions.sh

      - name: Terraform Deploy
        uses: hmcts/cnp-githubactions-library/terraform-deploy-openid@main
        with:
          environment: sbox
          subscription: ${{ vars.AZURE_SUBSCRIPTION_SBOX }}
          aks-subscription: ${{ vars.AZURE_SUBSCRIPTION_SBOX }}
          storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NONPROD }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID_SBOX }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_SBOX }}
          state-store-resource-group: rg-sps-platform-sbox
          state-store-account-name: spsapimapisboxstate
          state-store-container-name: terraform-state
          state-store-use-entra-id-auth: true
          working-directory: infrastructure
          plan-only: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.overrideAction == 'plan') }}
          product: cp-civil-caseingestion
          post-plan-to-pr: true

  # Same steps as terraform-sbox, for APIM demo (SIT backend). Federated in azure-github-federation-config #119.
  terraform-demo:
    name: Terraform demo
    needs: [ precheck ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.overrideAction == 'plan' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # apis.tf reads each spec with yamldecode(file(...)), which cannot follow the $refs into
      # paths/ and schemas/. Bundle every version folder's spec in place (v1/openapi.yml, ...),
      # at the paths demo.tfvars points to.
      - name: Bundle the modular spec of every API version
        run: |
          npm install -g @redocly/cli@latest
          bash .github/scripts/bundle-openapi-versions.sh

      - name: Terraform Deploy
        uses: hmcts/cnp-githubactions-library/terraform-deploy-openid@main
        with:
          environment: demo
          subscription: ${{ vars.AZURE_SUBSCRIPTION_DEMO }}
          aks-subscription: ${{ vars.AZURE_SUBSCRIPTION_DEMO }}
          storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NONPROD }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID_DEMO }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_DEMO }}
          state-store-resource-group: rg-sps-platform-demo
          state-store-account-name: spsapimapidemostate
          state-store-container-name: terraform-state
          state-store-use-entra-id-auth: true
          working-directory: infrastructure
          plan-only: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.overrideAction == 'plan') }}
          product: cp-civil-caseingestion
          post-plan-to-pr: true

  # Same steps as terraform-sbox, for APIM preview (SIT backend; demo does not connect to CP). Federated in azure-github-federation-config #122.
  terraform-preview:
    name: Terraform preview
    needs: [ precheck ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.overrideAction == 'plan' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # apis.tf reads each spec with yamldecode(file(...)), which cannot follow the $refs into
      # paths/ and schemas/. Bundle every version folder's spec in place (v1/openapi.yml, ...),
      # at the paths preview.tfvars points to.
      - name: Bundle the modular spec of every API version
        run: |
          npm install -g @redocly/cli@latest
          bash .github/scripts/bundle-openapi-versions.sh

      - name: Terraform Deploy
        uses: hmcts/cnp-githubactions-library/terraform-deploy-openid@main
        with:
          environment: preview
          subscription: ${{ vars.AZURE_SUBSCRIPTION_PREVIEW }}
          aks-subscription: ${{ vars.AZURE_SUBSCRIPTION_PREVIEW }}
          storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NONPROD }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID_PREVIEW }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PREVIEW }}
          state-store-resource-group: rg-sps-platform-preview
          state-store-account-name: spsapimapipreviewstate
          state-store-container-name: terraform-state
          state-store-use-entra-id-auth: true
          working-directory: infrastructure
          plan-only: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.overrideAction == 'plan') }}
          product: cp-civil-caseingestion
          post-plan-to-pr: true
