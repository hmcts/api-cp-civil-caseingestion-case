name: CI Build and Publish (RELEASE)

on:
  release:
    types: [published]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FILE_PATH_OPENAPI: "src/main/resources/openapi"

jobs:
  Artefact-Version:
    runs-on: ubuntu-latest
    outputs:
      artefact_version: ${{ steps.artefact.outputs.release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Artefact Version
        id: artefact
        uses: hmcts/artefact-version-action@v1
        with:
          release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Update-Spec-Version:
    needs: [Artefact-Version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      upload_artifact_name: openapi-spec-${{ needs.Artefact-Version.outputs.artefact_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle and version the spec in every API version folder
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
          API_NAME: ${{ github.event.repository.name }}
        run: |
          npm install -g @redocly/cli@latest
          bash .github/scripts/bundle-openapi-versions.sh "$ARTEFACT_VERSION" "$API_NAME"

      # Replaces hmcts/update-openapi-version, which handles a single spec file per workflow.
      - name: Upload the versioned specs
        id: upload_spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ needs.Artefact-Version.outputs.artefact_version }}
          path: ${{ env.FILE_PATH_OPENAPI }}

      - name: Attest the versioned specs
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: openapi-spec-${{ needs.Artefact-Version.outputs.artefact_version }}
          subject-digest: sha256:${{ steps.upload_spec.outputs.artifact-digest }}

  Publish:
    name: Publish - Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    needs: [ Artefact-Version, Update-Spec-Version ]
    strategy:
      matrix:
        java: [21]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download updated OpenAPI file
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Update-Spec-Version.outputs.upload_artifact_name }}
          path: ${{ env.FILE_PATH_OPENAPI }}

      - name: Gradle Publish
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          JAVA_VERSION: ${{ matrix.java }}
        run: |
          echo "Publishing artefact for ARTEFACT_VERSION=$ARTEFACT_VERSION using Java $JAVA_VERSION"
          
          gradle build -x test publish \
            -DAPI_SPEC_VERSION=$ARTEFACT_VERSION \
            -DGITHUB_REPOSITORY=${{ github.repository }} \
            -DGITHUB_ACTOR=${{ github.actor }} \
            -DGITHUB_TOKEN=$GITHUB_TOKEN \
            -DAZURE_DEVOPS_ARTIFACT_USERNAME=$AZURE_DEVOPS_ARTIFACT_USERNAME \
            -DAZURE_DEVOPS_ARTIFACT_TOKEN=$AZURE_DEVOPS_ARTIFACT_TOKEN
